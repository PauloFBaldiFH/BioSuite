name: Linux installer and panel
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, debian:12-slim, debian:13-slim]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap, panel tests and repeat installation
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src" -w /src "$TEST_IMAGE" bash tests/linux-smoke.sh 2>&1 | tee /tmp/biosuite-linux-smoke.log
      - name: Resumo público da falha Linux
        if: failure()
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          path = Path('/tmp/biosuite-linux-smoke.log')
          if path.is_file():
              with path.open(errors='replace') as stream:
                  text = ''.join(deque(stream, maxlen=50))[-10000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Linux installer and panel::' + text)
          PY
