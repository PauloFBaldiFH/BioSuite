name: Debian VM systemd and reboot
on:
  push:
    branches: [validation/debian-reboot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    # Apenas runners GitHub descartáveis: instala Galaxy e reinicia o guest QEMU.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - name: VM oficial Debian, instalação, backups e reboot real
        env:
          DEBIAN_RELEASE: ${{ matrix.release }}
        run: |
          set -o pipefail
          devices=()
          if [[ -c /dev/kvm ]]; then devices+=(--device /dev/kvm); fi
          docker run --rm "${devices[@]}" -v "$PWD:/src:ro" -w /src \
            -e GITHUB_ACTIONS=true -e BIOSUITE_DEBIAN_VM_SMOKE=1 \
            debian:13-slim bash tests/debian-qemu-smoke.sh "$DEBIAN_RELEASE" 2>&1 | tee /tmp/biosuite-debian-qemu.log
      - name: Resumo público da falha QEMU
        if: failure()
        run: |
          python3 - <<'PY'
          from collections import deque
          from pathlib import Path
          path = Path('/tmp/biosuite-debian-qemu.log')
          if path.is_file():
              with path.open(errors='replace') as stream:
                  text = ''.join(deque(stream, maxlen=40))[-3000:]
              print('::error title=Debian QEMU::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
