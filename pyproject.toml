[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosuite"
version = "0.6.0"
description = "Painel de administração modular para Galaxy"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["textual==8.2.0"]

[project.scripts]
biosuite = "biosuite.cli:main"
biosuite-config = "biosuite.cli:main"

[tool.setuptools.package-data]
biosuite = ["assets/*.sh", "assets/docker/*", "assets/*.py"]

[tool.setuptools.packages.find]
where = ["src"]
